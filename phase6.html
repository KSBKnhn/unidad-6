<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indefinido Trainer</title>
<style>
:root{
  --bg:#f5f5f7;--card:#ffffff;--text:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;
  --blue:#0071e3;--blue-h:#0077ed;--green:#28a745;--green-bg:#e8f6ec;--red:#e3342f;--red-bg:#fdecec;
  --orange:#f59e0b;--orange-bg:#fef5e6;--chip:#f0f0f3;--shadow:0 4px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--line:#38383a;--chip:#2c2c2e;
  --green-bg:#11301b;--red-bg:#3a1515;--orange-bg:#3a2a0c;--shadow:none}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
header{position:sticky;top:0;z-index:10;backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  background:color-mix(in srgb,var(--bg) 72%,transparent);border-bottom:1px solid var(--line)}
.bar{max-width:880px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:600;font-size:17px;letter-spacing:-.01em}
.logo span{color:var(--muted);font-weight:400}
.link{background:none;border:none;color:var(--blue);font-size:15px;cursor:pointer;font-family:inherit}
main{max-width:880px;margin:0 auto;padding:40px 22px 80px}
h1{font-size:44px;font-weight:700;letter-spacing:-.025em;line-height:1.08}
.lead{font-size:19px;color:var(--muted);margin-top:10px;line-height:1.45}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px}
.mode{background:var(--card);border-radius:22px;padding:24px;box-shadow:var(--shadow);cursor:pointer;
  border:2px solid transparent;transition:transform .2s,border-color .2s;text-align:left;font-family:inherit;color:inherit}
.mode:hover{transform:translateY(-2px)}
.mode.sel{border-color:var(--blue)}
.mode .num{font-size:13px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.06em}
.mode h3{font-size:21px;margin:8px 0 6px;letter-spacing:-.01em}
.mode p{font-size:14px;color:var(--muted);line-height:1.45}
.mode .ex{margin-top:14px;font-size:13px;background:var(--chip);border-radius:10px;padding:8px 10px;color:var(--text)}
.panel{background:var(--card);border-radius:22px;padding:26px;box-shadow:var(--shadow);margin-top:20px}
.panel h4{font-size:15px;color:var(--muted);font-weight:500;margin-bottom:16px}
.phases{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:150px}
.ph{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.ph .col{width:100%;max-width:56px;border-radius:10px 10px 6px 6px;background:var(--blue);min-height:6px;transition:height .5s}
.ph .cnt{font-weight:600;font-size:15px}
.ph .lbl{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:22px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:none;background:none;padding:7px 16px;border-radius:8px;font-size:14px;font-family:inherit;color:var(--text);cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:600}
.btn{background:var(--blue);color:#fff;border:none;border-radius:980px;padding:13px 28px;font-size:17px;font-family:inherit;cursor:pointer;font-weight:500}
.btn:hover{background:var(--blue-h)}
.btn.ghost{background:var(--chip);color:var(--text)}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.sw{width:42px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on .sw{background:var(--green)} .toggle.on .sw::after{left:19px}
/* quiz */
.top{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.prog{flex:1;height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.prog div{height:100%;background:var(--blue);transition:width .3s}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.qcard{background:var(--card);border-radius:28px;padding:44px 36px;box-shadow:var(--shadow);text-align:center}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:5px 12px;border-radius:980px;background:var(--chip);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.prompt{font-size:46px;font-weight:700;letter-spacing:-.025em;margin:22px 0 6px;line-height:1.1}
.sub{color:var(--muted);font-size:16px}
.inp{width:100%;max-width:440px;margin:30px auto 0;display:block;font-size:24px;padding:15px 20px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--text);text-align:center;font-family:inherit;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--blue)}
.inp.ok{border-color:var(--green);background:var(--green-bg)}
.inp.bad{border-color:var(--red);background:var(--red-bg)}
.inp.acc{border-color:var(--orange);background:var(--orange-bg)}
.keys{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.keys button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:17px;cursor:pointer;font-family:inherit}
.keys button:hover{background:var(--chip)}
.fb{margin-top:24px;min-height:62px;font-size:17px;line-height:1.5}
.fb .t{font-weight:600}
.fb.ok .t{color:var(--green)} .fb.bad .t{color:var(--red)} .fb.acc .t{color:var(--orange)}
.fb .sol{font-size:22px;font-weight:600;margin-top:2px}
.actions{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);margin-top:18px}
/* table mode */
.grid{display:grid;grid-template-columns:150px 1fr;gap:10px 14px;max-width:520px;margin:30px auto 0;text-align:left;align-items:center}
.grid label{font-size:15px;color:var(--muted);text-align:right}
.grid label.first{color:var(--text);font-weight:600}
.grid .inp{margin:0;max-width:none;font-size:18px;padding:10px 14px;text-align:left}
.grid .fix{grid-column:2;font-size:14px;color:var(--red);margin-top:-6px;font-weight:500}
.grid .fix.a{color:var(--orange)}
.sep{grid-column:1/-1;height:1px;background:var(--line);margin:4px 0}
/* result */
.big{font-size:80px;font-weight:700;letter-spacing:-.03em;text-align:center}
.stats{display:flex;justify-content:center;gap:40px;margin-top:10px;color:var(--muted)}
.stats b{display:block;font-size:28px;color:var(--text)}
.list{margin-top:26px;text-align:left}
.list div{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:15px}
.hidden{display:none!important}
@media (max-width:720px){
  h1{font-size:34px}.modes{grid-template-columns:1fr}.prompt{font-size:34px}
  .qcard{padding:32px 20px}.grid{grid-template-columns:96px 1fr}.grid label{font-size:13px}
}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo">Indefinido <span>Trainer</span></div>
  <button class="link hidden" id="homeBtn">Übersicht</button>
</div></header>

<main>
<!-- HOME -->
<section id="home">
  <h1>Verben im Indefinido.</h1>
  <p class="lead">30 Verben, sechs Phasen. Richtig beantwortet wandert eine Karte eine Phase weiter – falsch zurück auf Phase 1. Ziel: alles in Phase 6.</p>

  <div class="modes" id="modes">
    <button class="mode sel" data-m="1">
      <div class="num">Stufe 1</div><h3>Vokabeln</h3>
      <p>Deutscher Infinitiv → spanischer Infinitiv.</p>
      <div class="ex">bauen → <b>construir</b></div>
    </button>
    <button class="mode" data-m="2">
      <div class="num">Stufe 2</div><h3>Formen</h3>
      <p>Deutsche Präteritumsform → Indefinido. 180 Karten.</p>
      <div class="ex">ich baute → <b>construí</b></div>
    </button>
    <button class="mode" data-m="3">
      <div class="num">Stufe 3</div><h3>Tabellen-Profi</h3>
      <p>Nur das deutsche Verb ist gegeben: Infinitiv <i>und</i> alle sechs Formen eintragen.</p>
      <div class="ex">bauen → construir · construí · construiste …</div>
    </button>
  </div>

  <div class="panel">
    <h4 id="phTitle">Dein Fortschritt – Stufe 1</h4>
    <div class="phases" id="phases"></div>
    <div class="row">
      <div class="seg" id="size">
        <button data-n="10" class="on">10 Karten</button><button data-n="20">20</button><button data-n="999">Alle</button>
      </div>
      <div class="toggle on" id="accT"><div class="sw"></div>Akzente streng prüfen</div>
      <button class="btn" id="start">Los geht's</button>
    </div>
  </div>
  <div class="row" style="justify-content:flex-end">
    <button class="link" id="reset">Fortschritt dieser Stufe zurücksetzen</button>
  </div>
</section>

<!-- QUIZ -->
<section id="quiz" class="hidden">
  <div class="top"><div class="prog"><div id="progBar"></div></div><div class="count" id="count"></div></div>
  <div class="qcard">
    <span class="badge" id="badge"></span>
    <div class="prompt" id="prompt"></div>
    <div class="sub" id="sub"></div>
    <div id="single">
      <input class="inp" id="answer" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Antwort eingeben">
    </div>
    <div class="grid hidden" id="grid"></div>
    <div class="keys" id="keys"></div>
    <div class="fb" id="fb"></div>
    <div class="actions">
      <button class="btn" id="checkBtn">Prüfen</button>
      <button class="btn hidden" id="nextBtn">Weiter</button>
      <button class="btn ghost hidden" id="overBtn">Ich hatte recht</button>
    </div>
    <div class="hint">Enter = prüfen / weiter</div>
  </div>
</section>

<!-- RESULT -->
<section id="result" class="hidden">
  <div class="qcard">
    <span class="badge">Runde beendet</span>
    <div class="big" id="pct"></div>
    <div class="stats" id="rstats"></div>
    <div class="list" id="rlist"></div>
    <div class="actions" style="margin-top:28px">
      <button class="btn" id="again">Nächste Runde</button>
      <button class="btn ghost" id="toHome">Zur Übersicht</button>
    </div>
  </div>
</section>
</main>

<script>
const V=[
 ["construir","bauen",["construí","construiste","construyó","construimos","construisteis","construyeron"],["baute","bautest","baute","bauten","bautet","bauten"]],
 ["descubrir","entdecken",["descubrí","descubriste","descubrió","descubrimos","descubristeis","descubrieron"],["entdeckte","entdecktest","entdeckte","entdeckten","entdecktet","entdeckten"]],
 ["llegar","ankommen",["llegué","llegaste","llegó","llegamos","llegasteis","llegaron"],["kam an","kamst an","kam an","kamen an","kamt an","kamen an"]],
 ["viajar","reisen",["viajé","viajaste","viajó","viajamos","viajasteis","viajaron"],["reiste","reistest","reiste","reisten","reistet","reisten"]],
 ["empezar","anfangen, beginnen",["empecé","empezaste","empezó","empezamos","empezasteis","empezaron"],["fing an","fingst an","fing an","fingen an","fingt an","fingen an"]],
 ["fundar","gründen",["fundé","fundaste","fundó","fundamos","fundasteis","fundaron"],["gründete","gründetest","gründete","gründeten","gründetet","gründeten"]],
 ["terminar","beenden",["terminé","terminaste","terminó","terminamos","terminasteis","terminaron"],["beendete","beendetest","beendete","beendeten","beendetet","beendeten"]],
 ["matar","töten",["maté","mataste","mató","matamos","matasteis","mataron"],["tötete","tötetest","tötete","töteten","tötetet","töteten"]],
 ["ser","sein",["fui","fuiste","fue","fuimos","fuisteis","fueron"],["war","warst","war","waren","wart","waren"]],
 ["pasar","verbringen (Zeit)",["pasé","pasaste","pasó","pasamos","pasasteis","pasaron"],["verbrachte","verbrachtest","verbrachte","verbrachten","verbrachtet","verbrachten"]],
 ["salir","ausgehen, hinausgehen",["salí","saliste","salió","salimos","salisteis","salieron"],["ging aus","gingst aus","ging aus","gingen aus","gingt aus","gingen aus"]],
 ["levantarse","aufstehen",["me levanté","te levantaste","se levantó","nos levantamos","os levantasteis","se levantaron"],["stand auf","standst auf","stand auf","standen auf","standet auf","standen auf"]],
 ["quedarse","bleiben",["me quedé","te quedaste","se quedó","nos quedamos","os quedasteis","se quedaron"],["blieb","bliebst","blieb","blieben","bliebt","blieben"]],
 ["desayunar","frühstücken",["desayuné","desayunaste","desayunó","desayunamos","desayunasteis","desayunaron"],["frühstückte","frühstücktest","frühstückte","frühstückten","frühstücktet","frühstückten"]],
 ["ir","gehen, fahren",["fui","fuiste","fue","fuimos","fuisteis","fueron"],["ging","gingst","ging","gingen","gingt","gingen"]],
 ["ver","sehen",["vi","viste","vio","vimos","visteis","vieron"],["sah","sahst","sah","sahen","saht","sahen"]],
 ["encantar","begeistern, sehr gefallen",["encanté","encantaste","encantó","encantamos","encantasteis","encantaron"],["begeisterte","begeistertest","begeisterte","begeisterten","begeistertet","begeisterten"]],
 ["comer","essen",["comí","comiste","comió","comimos","comisteis","comieron"],["aß","aßest","aß","aßen","aßt","aßen"]],
 ["estudiar","studieren, lernen",["estudié","estudiaste","estudió","estudiamos","estudiasteis","estudiaron"],["studierte","studiertest","studierte","studierten","studiertet","studierten"]],
 ["tener","haben",["tuve","tuviste","tuvo","tuvimos","tuvisteis","tuvieron"],["hatte","hattest","hatte","hatten","hattet","hatten"]],
 ["acostarse","ins Bett gehen",["me acosté","te acostaste","se acostó","nos acostamos","os acostasteis","se acostaron"],["ging ins Bett","gingst ins Bett","ging ins Bett","gingen ins Bett","gingt ins Bett","gingen ins Bett"]],
 ["dormirse","einschlafen",["me dormí","te dormiste","se durmió","nos dormimos","os dormisteis","se durmieron"],["schlief ein","schliefst ein","schlief ein","schliefen ein","schlieft ein","schliefen ein"]],
 ["probar","probieren",["probé","probaste","probó","probamos","probasteis","probaron"],["probierte","probiertest","probierte","probierten","probiertet","probierten"]],
 ["hacer","machen",["hice","hiciste","hizo","hicimos","hicisteis","hicieron"],["machte","machtest","machte","machten","machtet","machten"]],
 ["nacer","geboren werden",["nací","naciste","nació","nacimos","nacisteis","nacieron"],["wurde geboren","wurdest geboren","wurde geboren","wurden geboren","wurdet geboren","wurden geboren"]],
 ["irse","weggehen",["me fui","te fuiste","se fue","nos fuimos","os fuisteis","se fueron"],["ging weg","gingst weg","ging weg","gingen weg","gingt weg","gingen weg"]],
 ["mudarse","umziehen",["me mudé","te mudaste","se mudó","nos mudamos","os mudasteis","se mudaron"],["zog um","zogst um","zog um","zogen um","zogt um","zogen um"]],
 ["escribir","schreiben",["escribí","escribiste","escribió","escribimos","escribisteis","escribieron"],["schrieb","schriebst","schrieb","schrieben","schriebt","schrieben"]],
 ["vivir","leben, wohnen",["viví","viviste","vivió","vivimos","vivisteis","vivieron"],["lebte","lebtest","lebte","lebten","lebtet","lebten"]],
 ["recibir","bekommen, erhalten",["recibí","recibiste","recibió","recibimos","recibisteis","recibieron"],["bekam","bekamst","bekam","bekamen","bekamt","bekamen"]]
];
const DEP=["ich","du","er/sie","wir","ihr","sie (Pl.)"];
const ESP=["yo","tú","él / ella","nosotros","vosotros","ellos / ellas"];
const KEY="indef_trainer_v1";

let S={1:{},2:{},3:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};

let mode=1,size=10,strict=true;
const $=id=>document.getElementById(id);

function ids(m){
  if(m==2){const a=[];V.forEach((_,i)=>DEP.forEach((_,p)=>a.push(i+"-"+p)));return a;}
  return V.map((_,i)=>String(i));
}
const ph=(m,id)=>S[m][id]||1;

function renderPhases(){
  $("phTitle").textContent="Dein Fortschritt – Stufe "+mode;
  const c=[0,0,0,0,0,0],all=ids(mode);
  all.forEach(id=>c[ph(mode,id)-1]++);
  const mx=Math.max(...c,1);
  $("phases").innerHTML=c.map((n,i)=>`<div class="ph"><div class="cnt">${n}</div>
    <div class="col" style="height:${Math.max(6,n/mx*100)}px;opacity:${.35+i*.13}"></div>
    <div class="lbl">${i==5?"Phase 6 ✓":"Phase "+(i+1)}</div></div>`).join("");
}

/* home controls */
$("modes").onclick=e=>{const b=e.target.closest(".mode");if(!b)return;
  document.querySelectorAll(".mode").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");mode=+b.dataset.m;renderPhases();};
$("size").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  $("size").querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");size=+b.dataset.n;};
$("accT").onclick=()=>{strict=!strict;$("accT").classList.toggle("on",strict);};
$("reset").onclick=()=>{if(confirm("Fortschritt von Stufe "+mode+" wirklich zurücksetzen?")){S[mode]={};save();renderPhases();}};

/* checking */
const norm=s=>s.toLowerCase().replace(/[¡!¿?.,;]/g,"").replace(/\s+/g," ").trim();
const bare=s=>norm(s).normalize("NFD").replace(/[̀-ͯ]/g,"");
function judge(input,sol){
  const a=norm(input),opts=[sol];
  if(!a)return"bad";
  if(opts.some(o=>norm(o)===a))return"ok";
  if(opts.some(o=>bare(o)===bare(a)))return strict?"acc":"ok";
  return"bad";
}

/* session */
let isFirst=false,prevPhase=1,Q=[],qi=0,total=0,stats,checked=false,cur=null,lastRes=null,firstTry={};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function start(){
  const all=shuffle(ids(mode)).sort((a,b)=>ph(mode,a)-ph(mode,b));
  Q=all.slice(0,Math.min(size,all.length));total=Q.length;qi=0;firstTry={};
  stats={ok:0,acc:0,bad:0,wrong:[]};
  show("quiz");renderKeys();load();
}
function show(id){["home","quiz","result"].forEach(s=>$(s).classList.toggle("hidden",s!==id));
  $("homeBtn").classList.toggle("hidden",id==="home");window.scrollTo(0,0);}

function load(){
  checked=false;cur=Q[qi];
  const done=Object.keys(firstTry).length;
  $("progBar").style.width=(done/total*100)+"%";
  $("count").textContent=Math.min(done+1,total)+" / "+total+(qi>=total?" · Wiederholung":"");
  $("badge").textContent="Phase "+ph(mode,cur);
  $("fb").className="fb";$("fb").innerHTML="";
  $("checkBtn").classList.remove("hidden");$("nextBtn").classList.add("hidden");$("overBtn").classList.add("hidden");
  if(mode==3){
    const v=V[+cur];
    $("prompt").textContent=v[1];$("sub").textContent="Infinitiv + alle Formen im Indefinido";
    $("single").classList.add("hidden");$("grid").classList.remove("hidden");
    const labels=["Infinitivo",...ESP];
    $("grid").innerHTML=labels.map((l,k)=>`<label class="${k==0?"first":""}">${l}</label><input class="inp" data-k="${k}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">${k==0?'<div class="sep"></div>':""}`).join("");
    $("grid").querySelector("input").focus();
  }else{
    $("single").classList.remove("hidden");$("grid").classList.add("hidden");
    const inp=$("answer");inp.value="";inp.className="inp";inp.disabled=false;
    if(mode==1){$("prompt").textContent=V[+cur][1];$("sub").textContent="Spanischer Infinitiv?";}
    else{const[i,p]=cur.split("-").map(Number);$("prompt").textContent=DEP[p]+" "+V[i][3][p];$("sub").textContent="Indefinido?";}
    inp.focus();
  }
}
function solution(id){
  if(mode==1)return V[+id][0];
  const[i,p]=id.split("-").map(Number);return V[i][2][p];
}

function setPhase(res){
  if(cur in firstTry)return; // Wiederholung in der Runde ändert die Phase nicht
  firstTry[cur]=res;const p=ph(mode,cur);
  if(res==="ok")S[mode][cur]=Math.min(6,p+1);
  else if(res==="bad")S[mode][cur]=1;
  save();stats[res]++;
  if(res!=="ok")stats.wrong.push(cur);
}

function check(){
  if(checked)return;checked=true;
  let res;
  if(mode==3){
    const v=V[+cur],sols=[v[0],...v[2]];let bad=0,acc=0;
    const inputs=[...$("grid").querySelectorAll("input")];
    inputs.forEach((inp,k)=>{
      const r=judge(inp.value,sols[k]);inp.disabled=true;
      inp.className="inp "+(r==="ok"?"ok":r==="acc"?"acc":"bad");
      if(r!=="ok"){const d=document.createElement("div");d.className="fix"+(r==="acc"?" a":"");d.textContent="→ "+sols[k];
        inp.after(d);if(k==0){/* keep separator order */const sep=d.nextElementSibling;}}
      if(r==="bad")bad++;if(r==="acc")acc++;
    });
    res=bad>=2?"bad":(bad==1||acc>0)?"acc":"ok";
    const msg=res==="ok"?"Perfekt – alle 7 richtig!":res==="acc"?(bad?"Fast! Ein Fehler – Karte bleibt in ihrer Phase.":"Fast! Achte auf die Akzente – Karte bleibt in ihrer Phase."):"Noch nicht – "+bad+" Fehler. Zurück auf Phase 1.";
    $("fb").className="fb "+res;$("fb").innerHTML=`<div class="t">${msg}</div>`;
  }else{
    const inp=$("answer"),sol=solution(cur);res=judge(inp.value,sol);
    inp.disabled=true;inp.className="inp "+res;
    const t=res==="ok"?"Richtig!":res==="acc"?"Fast – Akzent beachten! Karte bleibt in ihrer Phase.":"Leider falsch.";
    $("fb").className="fb "+res;
    $("fb").innerHTML=`<div class="t">${t}</div>${res!=="ok"||norm(inp.value)!==norm(sol)?`<div class="sol">${sol}</div>`:""}`+
      (mode==2&&res!=="ok"?`<div class="sub">${V[+cur.split("-")[0]][0]}</div>`:"");
  }
  isFirst=!(cur in firstTry);prevPhase=ph(mode,cur);lastRes=res;setPhase(res);
  if(res!=="ok"){Q.push(cur);$("overBtn").classList.remove("hidden");}
  $("checkBtn").classList.add("hidden");$("nextBtn").classList.remove("hidden");$("nextBtn").focus();
}
function override(){
  if(!isFirst){Q.splice(Q.lastIndexOf(cur),1);}
  else{const was=firstTry[cur];stats[was]--;stats.ok++;stats.wrong=stats.wrong.filter(x=>x!==cur);firstTry[cur]="ok";
    S[mode][cur]=Math.min(6,prevPhase+1);Q.splice(Q.lastIndexOf(cur),1);save();}
  $("fb").className="fb ok";$("fb").innerHTML='<div class="t">Als richtig gewertet.</div>';$("overBtn").classList.add("hidden");
}
function next(){qi++;if(qi>=Q.length)return finish();load();}
function finish(){
  const n=total,p=Math.round(stats.ok/n*100);
  $("pct").textContent=p+" %";
  $("rstats").innerHTML=`<div><b>${stats.ok}</b>richtig</div><div><b>${stats.acc}</b>fast</div><div><b>${stats.bad}</b>falsch</div>`;
  $("rlist").innerHTML=stats.wrong.length?'<div style="color:var(--muted);font-weight:600">Diese üben</div>'+stats.wrong.map(id=>{
    if(mode==2){const[i,q]=id.split("-").map(Number);return`<div><span>${DEP[q]} ${V[i][3][q]}</span><b>${V[i][2][q]}</b></div>`;}
    const v=V[+id];return`<div><span>${v[1]}</span><b>${mode==1?v[0]:v[0]+" · "+v[2].join(", ")}</b></div>`;}).join(""):"";
  show("result");
}

/* remember phase before check for override */


/* accent keys */
let lastInput=null;
document.addEventListener("focusin",e=>{if(e.target.classList&&e.target.classList.contains("inp"))lastInput=e.target;});
function renderKeys(){$("keys").innerHTML=["á","é","í","ó","ú","ñ"].map(k=>`<button tabindex="-1">${k}</button>`).join("");}
$("keys").onmousedown=e=>e.preventDefault();
$("keys").onclick=e=>{const b=e.target.closest("button");if(!b||!lastInput||lastInput.disabled)return;
  const i=lastInput,s=i.selectionStart,en=i.selectionEnd;i.value=i.value.slice(0,s)+b.textContent+i.value.slice(en);
  i.focus();i.setSelectionRange(s+1,s+1);};

/* keyboard */
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||$("quiz").classList.contains("hidden"))return;
  e.preventDefault();
  if(checked){next();return;}
  if(mode==3&&e.target.dataset&&e.target.dataset.k!==undefined){
    const k=+e.target.dataset.k;const nx=$("grid").querySelector(`input[data-k="${k+1}"]`);
    if(nx){nx.focus();return;}
  }
  check();
});
$("checkBtn").onclick=()=>check();
$("nextBtn").onclick=next;
$("overBtn").onclick=override;
$("start").onclick=start;
$("again").onclick=start;
$("toHome").onclick=$("homeBtn").onclick=()=>{renderPhases();show("home");};
renderPhases();
</script>
